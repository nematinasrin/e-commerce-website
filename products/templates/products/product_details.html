
{% extends 'products/base.html' %}

{% block content %}


        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder"> {{product.name}}  توضیحات محصول</h1>
                    <p class="lead fw-normal text-white-50 mb-0"><product class="pategory"></product></p>
                </div>
            </div>
        </header>



<div class="container py-5">

    <div class="row">

        <div class="col-md-6">
            <img src="{{ product.img.url }}" class="img-fluid rounded" alt="{{ product.name }}">
        </div>

        <div class="col-md-6">

            <h1>{{ product.name }}</h1>

            <h3 class="text-success">
                {{ product.price }}
            </h3>

            <p class="mt-4">
                {{ product.description }}
            </p>

            <p>
                <strong>دسته‌بندی:</strong> {{ product.category }}
            </p>



            <select class="form-select" id="qty">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <a href="{% url 'home' %}" class="btn btn-secondary mt-3">
                بازگشت به صفحه اصلی
            </a>



            
            <button type="button" class="btn btn-outline-dark mt-auto" id="add-to-cart" value="{{ product.id }}">
                 افزودن به سبد خرید
            </button> 


    </div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>

    $(document).on('click', '#add-to-cart', function (e) {
        e.preventDefault();
        $.ajax({
            type: 'POST',
            url: '{% url "cart_add" %}', // آدرس مقصد در urls.py
            data: {
                product_id: $('#add-to-cart').val(), // آیدی محصولاز المنت مربوطه

                product_qty: $('#qty option:selected').text(), // تعداد انتخاب شد
                
                csrfmiddlewaretoken: '{{ csrf_token }}', // امنیتجنگو

                action: 'post'
            },
            success: function(json) {

                document.getElementById('cart_quantity').textContent
                = json.qty;
            },  
            error: function(xhr, errmsg, err) {
                console.log("خطا در ارسال داده ها");
                
            }
        });
    });
</script>


{% endblock %}
